
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="160"
     viewBox="0 0 1000 160"
     role="img"
     aria-label="Thanks for visiting">

  <defs>
    <linearGradient id="topWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1684b8"/>
    </linearGradient>

    <linearGradient id="bottomWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#253f8f"/>
      <stop offset="55%" stop-color="#51339a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- BLUE TOP WAVE -->
  <path
    fill="url(#topWave)"
    d="M0 0H1000V63C780 35 635 80 470 65S160 45 0 58Z"
  />

  <!-- WAVE DEPTH -->
  <path
    fill="#0b234d"
    opacity="0.55"
    d="M0 57C215 83 340 53 550 64S790 56 1000 74V82C740 58 560 82 350 74S100 70 0 67Z"
  />

  <!-- THANK YOU HEADING -->
  <text
    x="500"
    y="37"
    fill="#ffffff"
    font-family="Arial,Helvetica,sans-serif"
    font-weight="700"
    font-size="27"
    text-anchor="middle">
    Thanks for visiting!
  </text>

  <!-- ANIMATED MESSAGE -->
  <text
    x="500"
    y="119"
    fill="#38bdf8"
    font-family="Consolas,Monaco,monospace"
    font-size="19"
    font-weight="600"
    text-anchor="middle">
    Keep building. Keep learning. Keep creating.

    <animate
      attributeName="opacity"
      values="1;1;0.65;1"
      keyTimes="0;0.55;0.75;1"
      dur="5s"
      repeatCount="indefinite"
    />
  </text>

  <!-- PURPLE-BLUE BOTTOM WAVE -->
  <path
    fill="url(#bottomWave)"
    opacity="0.9"
    d="M0 154 Q190 145 390 153 T760 150 T1000 153 V160 H0Z"
  />

</svg>
